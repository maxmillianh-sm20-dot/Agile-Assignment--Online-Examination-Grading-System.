<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Exam System</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; background-color: #f4f4f4; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #333; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input { width: 95%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .success-msg { background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-top: 10px; }
        #timer-display { font-size: 2em; font-weight: bold; color: #d9534f; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Exam System Prototype</h1>

    <div class="card">
        <h2>Update Profile</h2>
        <label>Full Name:</label>
        <input type="text" id="fullName" placeholder="John Doe">
        <label>Email Address:</label>
        <input type="email" id="email" placeholder="john@tarc.edu.my">
        <button onclick="saveProfile()">Update Profile</button>
        <div id="profile-msg" class="hidden success-msg">Profile updated successfully!</div>
    </div>

    <script>
        // --- ADDED IN COMMIT 3 ---
        function saveProfile() {
            const name = document.getElementById('fullName').value;
            if(name) {
                document.getElementById('profile-msg').classList.remove('hidden');
                setTimeout(() => document.getElementById('profile-msg').classList.add('hidden'), 3000);
            } else {
                alert("Please enter a name first.");
            }
        }
    </script>
</body>
</html>
